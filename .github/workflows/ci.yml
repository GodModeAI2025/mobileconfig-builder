name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Evals, Top-Level-Validierung, Secret-Scan, Release-Artefakt
    runs-on: ubuntu-latest
    env:
      # Gepinnter Stand von apple/device-management, Branch release.
      # Bewusst fest verdrahtet: Apple aendert das Schema laufend, und eine
      # CI, die deshalb ohne eigenes Zutun rot wird, sagt nichts ueber
      # diesen Code aus. Zum Anheben die neue SHA aus
      #   git ls-remote https://github.com/apple/device-management release
      # eintragen und die Evals lokal gegenpruefen.
      SCHEMA_SHA: 67045e2fa06f528b196c01edee6a8bf88b844beb

      # Gepinnter Stand von ProfileManifests, der zweiten Schema-Quelle fuer
      # Drittanbieter-Domains. Aus demselben Grund fest verdrahtet wie oben.
      # Neue SHA aus
      #   git ls-remote https://github.com/ProfileManifests/ProfileManifests master
      MANIFESTS_SHA: 32e11555ad66951aa4f402b0528377da1c671cdf

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Version, Changelog und dokumentierter Download-Name
        run: |
          version="$(cat VERSION)"
          echo "VERSION sagt $version"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "FEHLER: VERSION enthaelt '$version', erwartet ist 1.2.3"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "FEHLER: CHANGELOG.md hat keinen Abschnitt '## [$version]'."
            echo "Die Version wird nur in VERSION gepflegt, der Eintrag"
            echo "dazu gehoert in CHANGELOG.md."
            exit 1
          fi
          if ! grep -q \
              'releases/latest/download/mobileconfig-builder\.zip' README.md; then
            echo "FEHLER: README nennt den Download-Pfad nicht mehr so, wie"
            echo "das Release die Datei benennt."
            exit 1
          fi
          if ! grep -q \
              'package_release\.py dist/mobileconfig-builder\.zip' \
              .github/workflows/release.yml; then
            echo "FEHLER: release.yml haengt eine anders benannte Datei an"
            echo "das Release, als README und Landingpage verlinken."
            exit 1
          fi
          echo "OK: VERSION, CHANGELOG und der dokumentierte Download-Name" \
            "passen zusammen"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PyYAML installieren
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Schema-Cache aus gepinntem Apple-Stand fuellen
        run: |
          SCHEMA_DIR="$RUNNER_TEMP/device-management"
          mkdir -p "$SCHEMA_DIR"
          git -C "$SCHEMA_DIR" init -q
          git -C "$SCHEMA_DIR" remote add origin \
            https://github.com/apple/device-management.git
          git -C "$SCHEMA_DIR" fetch -q --depth 1 origin "$SCHEMA_SHA"
          git -C "$SCHEMA_DIR" checkout -q FETCH_HEAD
          python3 scripts/fetch_schema.py --from-clone "$SCHEMA_DIR"
          test -f "$HOME/.cache/mobileconfig-builder/release/TopLevel.yaml"

      - name: Eval-Suite
        run: python3 evals/run_tests.py

      # Der Validator fuer bereits vorhandene Profile. Die Eval-Suite deckt
      # ihn ab, hier steht der Blick von aussen: Exit-Code und Ausgabe, so
      # wie eine fremde CI sie sieht, die dieses Skript als Schranke vor ein
      # Repository voller .mobileconfig-Dateien stellt.
      - name: Bestehendes Profil pruefen
        run: |
          work="$(mktemp -d)"
          val="scripts/validate_mobileconfig.py"

          python3 scripts/build_mobileconfig.py \
            assets/examples/classroom_ipad.json \
            -o "$work/gut.mobileconfig" --offline --validate-strict \
            > /dev/null

          # 1. Was dieses Werkzeug baut, muss auch strikt durchgehen.
          python3 "$val" "$work/gut.mobileconfig" --offline --strict
          echo "OK 1: selbst gebautes Profil laeuft strikt mit Exit 0 durch"

          # 2. Erfundener Key. Apples Schema sagt dazu nichts, also Warnung
          # und Exit 1; mit --strict ein Fehler und Exit 2. Beides zaehlt in
          # CI als rot, der Unterschied ist die Aussage.
          python3 - "$work/gut.mobileconfig" "$work/erfunden.mobileconfig" \
            <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as fh:
              profil = plistlib.load(fh)
          profil["PayloadContent"][0]["GibtEsNichtKey"] = "irgendwas"
          with open(sys.argv[2], "wb") as fh:
              plistlib.dump(profil, fh)
          PY

          rc=0
          python3 "$val" "$work/erfunden.mobileconfig" --offline \
            > "$work/lax.txt" || rc=$?
          cat "$work/lax.txt"
          if [ "$rc" -ne 1 ]; then
            echo "FEHLER: Exit 1 erwartet fuer eine reine Warnung, bekommen $rc"
            exit 1
          fi
          if ! grep -q "WARNUNG" "$work/lax.txt"; then
            echo "FEHLER: der Befund ist nicht als Warnung ausgewiesen"
            exit 1
          fi
          if ! grep -q "PayloadContent\[0\]" "$work/lax.txt"; then
            echo "FEHLER: der Befund nennt seinen Pfad nicht"
            exit 1
          fi
          if ! grep -q "GibtEsNichtKey" "$work/lax.txt"; then
            echo "FEHLER: der erfundene Key wird nicht benannt"
            exit 1
          fi

          rc=0
          python3 "$val" "$work/erfunden.mobileconfig" --offline --strict \
            > "$work/streng.txt" || rc=$?
          cat "$work/streng.txt"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: mit --strict war Exit 2 erwartet, bekommen $rc"
            exit 1
          fi
          echo "OK 2: erfundener Key ist Warnung mit Exit 1, strikt Fehler" \
            "mit Exit 2"

          # 3. Wert ausserhalb der rangelist. Das verletzt das Schema und ist
          # deshalb auch ohne --strict ein Fehler.
          python3 - "$work/gut.mobileconfig" "$work/verletzt.mobileconfig" \
            <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as fh:
              profil = plistlib.load(fh)
          profil["PayloadContent"][0]["EncryptionType"] = "SUPERWPA"
          profil["PayloadScope"] = "Galaxy"
          with open(sys.argv[2], "wb") as fh:
              plistlib.dump(profil, fh)
          PY

          rc=0
          python3 "$val" "$work/verletzt.mobileconfig" --offline \
            > "$work/verletzt.txt" || rc=$?
          cat "$work/verletzt.txt"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit 2 erwartet fuer den Schema-Verstoss, bekommen $rc"
            exit 1
          fi
          if ! grep -q "SUPERWPA" "$work/verletzt.txt"; then
            echo "FEHLER: der abgelehnte Wert wird nicht benannt"
            exit 1
          fi
          if ! grep -q "top-level" "$work/verletzt.txt"; then
            echo "FEHLER: der Top-Level-Verstoss wird nicht als solcher gemeldet"
            exit 1
          fi
          echo "OK 3: Schema-Verstoss ist auch ohne --strict Exit 2"

          # 4. Maschinenlesbare Ausgabe, damit eine fremde CI die Befunde
          # weiterverarbeiten kann.
          rc=0
          python3 "$val" "$work/verletzt.mobileconfig" --offline \
            --format json > "$work/befunde.json" || rc=$?
          python3 -c "import json,sys; \
            d=json.load(open(sys.argv[1])); \
            assert d['exit_code']==2, d; \
            assert d['fehler']>=2, d; \
            b=d['dateien'][0]['befunde']; \
            assert all({'stufe','pfad','text'} <= set(x) for x in b), b; \
            print('JSON-Befunde:', len(b))" "$work/befunde.json"
          echo "OK 4: --format json liefert Stufe, Pfad und Exit-Code"

          # 5. Eine Datei, die kein Profil ist. Meldung mit Exit 2, kein
          # Traceback.
          echo "das ist kein Profil" > "$work/keine-plist.mobileconfig"
          rc=0
          python3 "$val" "$work/keine-plist.mobileconfig" --offline \
            > "$work/mist.txt" 2> "$work/mist.err" || rc=$?
          cat "$work/mist.txt" "$work/mist.err"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit 2 erwartet, bekommen $rc"
            exit 1
          fi
          if grep -q 'Traceback (most recent call last)' \
              "$work/mist.txt" "$work/mist.err"; then
            echo "FEHLER: Absturz statt Meldung"
            exit 1
          fi
          echo "OK 5: keine Plist endet mit Meldung und Exit 2"

      - name: Erfundener Top-Level-Key bricht strikt ab
        run: |
          work="$(mktemp -d)"
          spec="$work/bad_top.json"
          out="$work/bad_top.mobileconfig"
          cat > "$spec" <<'JSON'
          {
            "meta": {
              "PayloadIdentifier": "com.example.ci.badtop",
              "PayloadDisplayName": "Erfundener Top-Level-Key",
              "TotallyMadeUpKey": "nope"
            },
            "payloads": [
              {
                "PayloadType": "com.apple.applicationaccess",
                "allowCamera": false
              }
            ]
          }
          JSON

          rc=0
          python3 scripts/build_mobileconfig.py "$spec" -o "$out" \
            --offline --validate-strict > "$work/out.txt" 2> "$work/err.txt" \
            || rc=$?
          cat "$work/err.txt"

          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit-Code 2 erwartet, bekommen $rc"
            exit 1
          fi
          if [ -e "$out" ]; then
            echo "FEHLER: trotz Validierungsfehler wurde $out geschrieben"
            exit 1
          fi
          if ! grep -q "top-level: unknown key 'TotallyMadeUpKey'" \
              "$work/err.txt"; then
            echo "FEHLER: der Fund wird nicht als Top-Level-Problem gemeldet"
            exit 1
          fi
          if grep -q 'Traceback (most recent call last)' "$work/err.txt"; then
            echo "FEHLER: Absturz statt Validierungsreport"
            exit 1
          fi

          python3 scripts/build_mobileconfig.py "$spec" \
            -o "$work/lax.mobileconfig" --offline
          test -f "$work/lax.mobileconfig"
          echo "OK: strikt Exit 2 ohne Datei, ohne --validate-strict Exit 0 mit Datei"

      # Die Wege, auf denen die Signatur an den Ausgabepfad kommt. Bis Welle 5
      # schrieb openssl direkt dorthin, jetzt liegt eine Temporaerdatei
      # dazwischen. Beides sind Faelle, die die Eval-Suite nicht sieht: sie
      # kennt kein Zertifikat, prueft also nur, was beim Scheitern passiert.
      # Hier gibt es eins, und damit auch den Erfolgsfall.
      - name: Signieren gegen den Ausgabepfad
        run: |
          work="$(mktemp -d)"
          cd "$work"
          openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem \
            -days 2 -nodes -subj "/CN=CI-Signer" 2>/dev/null
          cat > spec.json <<'JSON'
          {
            "meta": {
              "PayloadIdentifier": "com.example.ci.signpfad",
              "PayloadDisplayName": "Signierpfade"
            },
            "payloads": [
              {"PayloadType": "com.apple.applicationaccess",
               "allowCamera": false}
            ]
          }
          JSON

          build="$GITHUB_WORKSPACE/scripts/build_mobileconfig.py"
          sign() {
            python3 "$build" "$work/spec.json" -o "$1" --offline \
              --sign-cert "$work/cert.pem" --sign-key "$work/key.pem"
          }
          gueltig() {
            openssl smime -verify -inform der -in "$1" -noverify \
              >/dev/null 2>&1
          }

          # 1. Normalfall. Ohne den sagen die anderen Faelle nichts.
          mkdir -p "$work/a"
          sign "$work/a/profil.mobileconfig"
          gueltig "$work/a/profil.mobileconfig" \
            || { echo "FEHLER: Normalfall liefert keine gueltige Signatur"; exit 1; }
          echo "OK 1: Normalfall signiert"

          # 2. Langer Ausgabename. Die Temporaerdatei heisst nach ihrem Ziel
          # und braucht Platz fuer die Zufallszeichen von mkstemp. Ungekuerzt
          # scheiterte hier, was vorher durchging.
          mkdir -p "$work/b"
          lang="$(python3 -c "print('l'*241 + '.mobileconfig')")"
          sign "$work/b/$lang"
          gueltig "$work/b/$lang" \
            || { echo "FEHLER: 254 Zeichen langer Name signiert nicht"; exit 1; }
          rest="$(ls "$work/b" | grep -c '\.teil$' || true)"
          if [ "$rest" != "0" ]; then
            echo "FEHLER: $rest Temporaerdatei(en) liegengeblieben"
            ls -l "$work/b"
            exit 1
          fi
          echo "OK 2: 254 Zeichen langer Name signiert, keine Reste"

          # 3. Ausgabepfad ist ein symbolischer Link. openssl schrieb durch
          # ihn hindurch; os.replace wuerde den Link durch eine Datei
          # ersetzen und die verlinkte Datei leer zuruecklassen.
          mkdir -p "$work/c"
          : > "$work/c/echt.mobileconfig"
          ln -s "$work/c/echt.mobileconfig" "$work/c/link.mobileconfig"
          sign "$work/c/link.mobileconfig"
          if [ ! -L "$work/c/link.mobileconfig" ]; then
            echo "FEHLER: der Link wurde durch eine gewoehnliche Datei ersetzt"
            ls -l "$work/c"
            exit 1
          fi
          gueltig "$work/c/echt.mobileconfig" \
            || { echo "FEHLER: die verlinkte Datei blieb leer"; ls -l "$work/c"; exit 1; }
          echo "OK 3: Symlink bleibt stehen, die verlinkte Datei ist signiert"

          # 4. Ausgabepfad ist ein Verzeichnis. Meldung mit Exit 2, kein
          # Traceback aus os.replace.
          mkdir -p "$work/d/profil.mobileconfig"
          rc=0
          python3 "$build" "$work/spec.json" -o "$work/d/profil.mobileconfig" \
            --offline --sign-cert "$work/cert.pem" --sign-key "$work/key.pem" \
            > "$work/d.out" 2> "$work/d.err" || rc=$?
          cat "$work/d.err"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit 2 erwartet, bekommen $rc"
            exit 1
          fi
          if grep -q 'Traceback (most recent call last)' "$work/d.err"; then
            echo "FEHLER: Absturz statt Meldung"
            exit 1
          fi
          echo "OK 4: Verzeichnis als Ausgabepfad endet mit Meldung und Exit 2"

          # 5. Zweiter Bau auf denselben Pfad, diesmal mit unbrauchbarem
          # Schluessel. Das dort liegende gueltige Profil muss ueberleben.
          mkdir -p "$work/e"
          sign "$work/e/profil.mobileconfig"
          vorher="$(sha256sum "$work/e/profil.mobileconfig" | cut -d' ' -f1)"
          echo "kein schluessel" > "$work/e/kaputt.pem"
          rc=0
          python3 "$build" "$work/spec.json" -o "$work/e/profil.mobileconfig" \
            --offline --sign-cert "$work/cert.pem" \
            --sign-key "$work/e/kaputt.pem" \
            > "$work/e.out" 2> "$work/e.err" || rc=$?
          cat "$work/e.err"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit 2 erwartet, bekommen $rc"
            exit 1
          fi
          if grep -q 'Traceback (most recent call last)' "$work/e.err"; then
            echo "FEHLER: Absturz statt Meldung"
            exit 1
          fi
          nachher="$(sha256sum "$work/e/profil.mobileconfig" | cut -d' ' -f1)"
          if [ "$vorher" != "$nachher" ]; then
            echo "FEHLER: das vorhandene Profil hat den Fehlschlag nicht"
            echo "ueberlebt ($vorher -> $nachher)"
            exit 1
          fi
          echo "OK 5: gescheiterter zweiter Bau laesst das alte Profil ganz"

          # 6. Der Validator auf einer signierten Datei. Das ist die einzige
          # Stelle in dieser CI, an der ein PKCS#7-Container entsteht, und
          # damit die einzige, an der sich das Auspacken pruefen laesst.
          # Danach dasselbe mit einem geaenderten Byte: `openssl smime
          # -verify -noverify` laesst die Kette ungeprueft, die Signatur
          # nicht, also muss der Griff in die Datei auffallen.
          python3 "$GITHUB_WORKSPACE/scripts/validate_mobileconfig.py" \
            "$work/a/profil.mobileconfig" --offline --strict
          echo "OK 6: signiertes Profil wird ausgepackt und laeuft durch"

          python3 - "$work/a/profil.mobileconfig" "$work/a/kaputt.sig" <<'PY'
          import pathlib, sys
          roh = bytearray(pathlib.Path(sys.argv[1]).read_bytes())
          stelle = roh.find(b"Signierpfade")
          roh[stelle:stelle + 4] = b"XXXX"
          pathlib.Path(sys.argv[2]).write_bytes(bytes(roh))
          PY
          rc=0
          python3 "$GITHUB_WORKSPACE/scripts/validate_mobileconfig.py" \
            "$work/a/kaputt.sig" --offline > "$work/a/sig.txt" || rc=$?
          cat "$work/a/sig.txt"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit 2 erwartet fuer die veraenderte Signatur," \
              "bekommen $rc"
            exit 1
          fi
          if ! grep -q "PKCS#7" "$work/a/sig.txt"; then
            echo "FEHLER: der Befund benennt den Container nicht"
            exit 1
          fi
          echo "OK 7: veraenderte signierte Datei wird abgelehnt"

      # Zertifikats-Payload aus einer JSON-Spec. Bis Welle 7 ging das nicht:
      # <data> will Bytes, JSON kennt keine, und jeder Zertifikats-Payload
      # scheiterte an genau dieser Stelle. Das Zertifikat entsteht hier zur
      # Laufzeit, im Repo liegt keins.
      - name: Zertifikat aus einer JSON-Spec
        run: |
          work="$(mktemp -d)"
          cd "$work"
          openssl req -x509 -newkey rsa:2048 -keyout ci.key -out ci.pem \
            -days 2 -nodes -subj "/CN=CI-Wurzel" 2>/dev/null
          openssl x509 -in ci.pem -outform der -out ci.der

          build="$GITHUB_WORKSPACE/scripts/build_mobileconfig.py"
          val="$GITHUB_WORKSPACE/scripts/validate_mobileconfig.py"

          python3 - <<'PY'
          import base64, json, pathlib
          roh = pathlib.Path("ci.der").read_bytes()
          def spec(kennung, inhalt):
              return {"meta": {"PayloadIdentifier": kennung,
                               "PayloadDisplayName": "CI-Wurzelzertifikat"},
                      "payloads": [{"PayloadType": "com.apple.security.root",
                                    "PayloadCertificateFileName": "ci.cer",
                                    "PayloadContent": inhalt}]}
          pathlib.Path("b64.json").write_text(json.dumps(spec(
              "com.example.ci.cert.b64",
              {"__base64__": base64.b64encode(roh).decode()})))
          pathlib.Path("datei.json").write_text(json.dumps(spec(
              "com.example.ci.cert.datei", {"__file__": "ci.der"})))
          pathlib.Path("nackt.json").write_text(json.dumps(spec(
              "com.example.ci.cert.nackt",
              base64.b64encode(roh).decode())))
          pathlib.Path("kaputt.json").write_text(json.dumps(spec(
              "com.example.ci.cert.kaputt",
              {"__base64__": "kein gueltiges base64!!"})))
          print("Spec-Dateien geschrieben,", len(roh), "DER-Bytes")
          PY

          # 1. Beide Marker bauen, und beide tragen dieselben Bytes wie die
          # DER-Datei. Der Validator aus demselben Repo sieht sich das
          # Ergebnis danach noch einmal an.
          for weg in b64 datei; do
            python3 "$build" "$work/$weg.json" -o "$work/$weg.mobileconfig" \
              --offline --validate-strict > /dev/null
            python3 "$val" "$work/$weg.mobileconfig" --offline --strict \
              > /dev/null
          done
          python3 -c "import plistlib,pathlib,sys; \
            soll=pathlib.Path('ci.der').read_bytes(); \
            [sys.exit('FEHLER: %s traegt andere Bytes' % w) \
             for w in ('b64','datei') \
             if plistlib.load(open(w+'.mobileconfig','rb'))\
                ['PayloadContent'][0]['PayloadContent'] != soll]; \
            print('beide Wege tragen', len(soll), 'Bytes, identisch zur DER-Datei')"
          echo "OK 1: __base64__ und __file__ bauen ein gueltiges" \
            "Zertifikats-Profil"

          # 2. Ohne Marker bleibt es beim alten Verhalten. Ein nackter
          # Base64-String ist eine Zeichenkette, und das Schema will Bytes.
          rc=0
          python3 "$build" "$work/nackt.json" -o "$work/nackt.mobileconfig" \
            --offline --validate-strict 2> "$work/nackt.txt" || rc=$?
          cat "$work/nackt.txt"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit 2 erwartet fuer den nackten String, bekommen $rc"
            exit 1
          fi
          if ! grep -q "expected <data>, got str" "$work/nackt.txt"; then
            echo "FEHLER: die alte Meldung fehlt"
            exit 1
          fi
          echo "OK 2: nackter Base64-String faellt weiter durch"

          # 3. Kaputtes Base64: Meldung mit Exit 2, keine Ausgabedatei, kein
          # Traceback.
          rc=0
          python3 "$build" "$work/kaputt.json" \
            -o "$work/kaputt.mobileconfig" --offline --validate-strict \
            2> "$work/kaputt.txt" || rc=$?
          cat "$work/kaputt.txt"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit 2 erwartet, bekommen $rc"
            exit 1
          fi
          if [ -e "$work/kaputt.mobileconfig" ]; then
            echo "FEHLER: trotz Abbruch wurde eine Datei geschrieben"
            exit 1
          fi
          if grep -q 'Traceback (most recent call last)' "$work/kaputt.txt"; then
            echo "FEHLER: Absturz statt Meldung"
            exit 1
          fi
          echo "OK 3: kaputtes Base64 endet mit Meldung und Exit 2"

      - name: Schema-Inspektion des Wi-Fi-Payloads
        run: |
          out="$(python3 scripts/inspect_payload.py com.apple.wifi.managed \
            --os macOS --offline)"
          head -12 <<<"$out"
          for key in SSID_STR EncryptionType AutoJoin Password ProxyType; do
            if ! grep -q "$key" <<<"$out"; then
              echo "FEHLER: $key fehlt in der Schema-Ausgabe"
              exit 1
            fi
          done
          echo "OK: inspect_payload liefert die erwarteten Wi-Fi-Keys"

      - name: Drittanbieter-Domain gegen ProfileManifests
        run: |
          work="$(mktemp -d)"
          cat > "$work/chrome.json" <<'JSON'
          {
            "meta": {
              "PayloadIdentifier": "com.example.ci.chrome",
              "PayloadDisplayName": "Chrome-Richtlinien"
            },
            "payloads": [
              {
                "PayloadType": "com.google.Chrome",
                "IncognitoModeAvailability": 1,
                "PasswordManagerEnabled": false,
                "URLBlocklist": ["example.invalid"]
              }
            ]
          }
          JSON

          # Ohne --manifests kennt niemand com.google.Chrome. Das ist der
          # Ausgangszustand, den die zweite Quelle behebt.
          rc=0
          python3 scripts/build_mobileconfig.py "$work/chrome.json" \
            -o "$work/ohne.mobileconfig" --offline --validate-strict \
            2> "$work/ohne.txt" || rc=$?
          cat "$work/ohne.txt"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: ohne --manifests wurde Exit 2 erwartet, bekommen $rc"
            exit 1
          fi
          if ! grep -q "unknown PayloadType 'com.google.Chrome'" \
              "$work/ohne.txt"; then
            echo "FEHLER: die Meldung benennt den unbekannten PayloadType nicht"
            exit 1
          fi

          # Mit --manifests, gegen den gepinnten Stand.
          python3 scripts/build_mobileconfig.py "$work/chrome.json" \
            -o "$work/mit.mobileconfig" --validate-strict \
            --manifests --manifests-ref "$MANIFESTS_SHA" \
            2> "$work/mit.txt"
          cat "$work/mit.txt"
          test -s "$work/mit.mobileconfig"
          python3 -c "import plistlib,sys; \
            p=plistlib.load(open(sys.argv[1],'rb'))['PayloadContent'][0]; \
            assert p['PayloadType']=='com.google.Chrome', p; \
            assert p['IncognitoModeAvailability']==1, p; \
            print('Payload im Profil:', sorted(p))" "$work/mit.mobileconfig"
          if ! grep -q 'ProfileManifests' "$work/mit.txt"; then
            echo "FEHLER: der Lauf weist die Herkunft des Schemas nicht aus"
            exit 1
          fi

          # Der Validator kennt dieselbe zweite Quelle. Ohne diese Zeilen
          # waere sein --manifests-Flag dokumentiert und ungemessen.
          python3 scripts/validate_mobileconfig.py "$work/mit.mobileconfig" \
            --strict --manifests --manifests-ref "$MANIFESTS_SHA" \
            > "$work/val_mit.txt"
          cat "$work/val_mit.txt"
          if ! grep -q 'ProfileManifests' "$work/val_mit.txt"; then
            echo "FEHLER: der Validator weist die Herkunft nicht aus, und ein"
            echo "sauberes Ergebnis ohne diese Angabe verschweigt, nach"
            echo "wessen Regel geprueft wurde"
            exit 1
          fi
          rc=0
          python3 scripts/validate_mobileconfig.py "$work/mit.mobileconfig" \
            --offline --strict > "$work/ohne_quelle.txt" || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: ohne --manifests war Exit 2 erwartet, bekommen $rc"
            cat "$work/ohne_quelle.txt"
            exit 1
          fi

          # Erfundener Chrome-Key faellt auch mit der zweiten Quelle durch.
          cat > "$work/bad.json" <<'JSON'
          {
            "meta": {"PayloadIdentifier": "com.example.ci.chrome.bad"},
            "payloads": [
              {
                "PayloadType": "com.google.Chrome",
                "GibtEsNichtEnabled": true,
                "IncognitoModeAvailability": 99
              }
            ]
          }
          JSON
          rc=0
          python3 scripts/build_mobileconfig.py "$work/bad.json" \
            -o "$work/bad.mobileconfig" --validate-strict \
            --manifests --manifests-ref "$MANIFESTS_SHA" \
            2> "$work/bad.txt" || rc=$?
          cat "$work/bad.txt"
          if [ "$rc" -ne 2 ]; then
            echo "FEHLER: Exit 2 erwartet fuer den erfundenen Key, bekommen $rc"
            exit 1
          fi
          if [ -e "$work/bad.mobileconfig" ]; then
            echo "FEHLER: trotz Validierungsfehler wurde eine Datei geschrieben"
            exit 1
          fi
          if ! grep -q 'GibtEsNichtEnabled' "$work/bad.txt"; then
            echo "FEHLER: der erfundene Key wird nicht benannt"
            exit 1
          fi

          # Kein Manifest darf im Arbeitsverzeichnis landen: das Repo hat
          # keine Lizenz, der Cache liegt woanders.
          cache="$HOME/.cache/mobileconfig-builder/profilemanifests"
          test -f "$cache/$MANIFESTS_SHA/com.google.Chrome.plist"
          if git status --porcelain | grep -q .; then
            echo "FEHLER: der Lauf hat das Arbeitsverzeichnis veraendert"
            git status --porcelain
            exit 1
          fi
          echo "OK: Chrome validiert gegen ProfileManifests, nichts davon" \
            "liegt im Repo"

      - name: Secret-Scan
        run: python3 tools/scan_secrets.py

      - name: Release-Artefakt bauen und pruefen
        run: |
          zip="$RUNNER_TEMP/artefakt/mobileconfig-builder.zip"
          python3 scripts/package_release.py "$zip"

          if [ ! -s "$zip" ]; then
            echo "FEHLER: $zip fehlt oder ist leer"
            exit 1
          fi

          namen="$(unzip -Z1 "$zip")"
          echo "$namen"

          for pfad in \
            mobileconfig-builder/SKILL.md \
            mobileconfig-builder/VERSION \
            mobileconfig-builder/LICENSE \
            mobileconfig-builder/NOTICE \
            mobileconfig-builder/scripts/build_mobileconfig.py \
            mobileconfig-builder/scripts/fetch_schema.py \
            mobileconfig-builder/scripts/inspect_payload.py \
            mobileconfig-builder/scripts/validate_mobileconfig.py \
            mobileconfig-builder/evals/run_tests.py \
            mobileconfig-builder/evals/evals.json \
            mobileconfig-builder/references/signing.md \
            mobileconfig-builder/assets/examples/wifi_guest.json
          do
            if ! grep -qxF "$pfad" <<<"$namen"; then
              echo "FEHLER: $pfad fehlt im Archiv"
              exit 1
            fi
          done

          # Repo-Innereien, Landingpage, erzeugte Profile, Schluesselmaterial.
          verboten='(^|/)\.git(/|$)|(^|/)\.github(/|$)|(^|/)__pycache__(/|$)'
          verboten="$verboten"'|(^|/)index\.html$|(^|/)course\.html$'
          verboten="$verboten"'|\.mobileconfig$|\.(pem|key|p12|pfx|cer|crt|pyc)$'
          if grep -Eq "$verboten" <<<"$namen"; then
            echo "FEHLER: das Archiv enthaelt Dateien, die nicht ausgeliefert"
            echo "werden duerfen:"
            grep -E "$verboten" <<<"$namen"
            exit 1
          fi

          if [ "$(unzip -p "$zip" mobileconfig-builder/VERSION)" \
               != "$(cat VERSION)" ]; then
            echo "FEHLER: die VERSION im Archiv weicht von der im Repo ab"
            exit 1
          fi

          # Zweiter Lauf, gleiches Ergebnis. Ohne das taugt die Datei nicht
          # als Beleg dafuer, was in einem Release steckt.
          zip2="$RUNNER_TEMP/artefakt2/mobileconfig-builder.zip"
          python3 scripts/package_release.py "$zip2" --quiet
          if ! cmp -s "$zip" "$zip2"; then
            echo "FEHLER: zwei Laeufe ergeben verschiedene Archive"
            exit 1
          fi

          echo "OK: Artefakt vollstaendig, ohne Repo-Innereien, reproduzierbar"
